# UNVERIFIED: not build-tested (no Docker available in the dev environment
# this was written in). Review/test with `docker compose config` and a real
# build before relying on it. For local dev parity only — the actual deploy
# targets (Render/Railway + Vercel/Netlify, see README.md) don't use this.
#
# Requires backend/.env to exist first (gitignored, never committed — copy
# from .env.example and set a real SECRET_KEY).
services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - backend/.env
    volumes:
      - uploads:/app/backend/uploads
      - hf-cache:/root/.cache/huggingface

  frontend:
    build:
      context: frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: http://localhost:8000/api/v1
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  uploads:
  hf-cache:
